<ion-view view-title="Atualização Cadastral">
  <ion-content>
    <form name="perfilForm" ng-submit="salvar(perfilForm)" novalidate>

      <div class="secao-titulo">Dados institucionais</div>
      <div class="list">
        <label class="item item-input item-stacked-label">
          <span class="input-label">Nome completo</span>
          <input type="text" ng-model="aluno.nome" ng-disabled="true">
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Matrícula</span>
          <input type="text" ng-model="aluno.matricula" ng-disabled="true">
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Curso</span>
          <input type="text" ng-model="aluno.curso" ng-disabled="true">
        </label>
      </div>

      <div class="secao-titulo">Contato</div>
      <div class="list">
        <label class="item item-input item-stacked-label">
          <span class="input-label">E-mail pessoal</span>
          <input type="email" name="email" ng-model="form.email" required>
        </label>
        <div class="msg-erro" ng-if="perfilForm.email.$invalid && perfilForm.$submitted">E-mail inválido.</div>

        <label class="item item-input item-stacked-label">
          <span class="input-label">Telefone / WhatsApp</span>
          <input type="tel" name="telefone" ng-model="form.telefone" required>
        </label>
      </div>

      <div class="secao-titulo">Endereço</div>
      <div class="list">
        <label class="item item-input item-stacked-label">
          <span class="input-label">CEP</span>
          <input type="text" name="cep" ng-model="form.endereco.cep" required>
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Rua</span>
          <input type="text" name="rua" ng-model="form.endereco.rua" required>
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Bairro</span>
          <input type="text" name="bairro" ng-model="form.endereco.bairro" required>
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Cidade</span>
          <input type="text" name="cidade" ng-model="form.endereco.cidade" required>
        </label>
      </div>

      <div class="padding">
        <button type="submit" class="button button-block button-ucsal">Salvar Alterações</button>
      </div>
    </form>
  </ion-content>
</ion-view>
